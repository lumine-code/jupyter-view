name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Check package contents
        run: npm pack --dry-run

  integration:
    # Run the Jasmine spec suite inside a real Lumine build. The specs use the
    # editor runtime (the notebook document model, the watchFile path-watcher,
    # the jupyter.adapter contract), including real filesystem exports.
    name: Lumine integration specs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      LUMINE_JASMINE_REPORTER: list
      TEMP: ${{ github.workspace }}/jupyter-view-spec-tmp
      TMP: ${{ github.workspace }}/jupyter-view-spec-tmp
      TMPDIR: ${{ github.workspace }}/jupyter-view-spec-tmp
    steps:
      - uses: actions/checkout@v7
        with:
          path: jupyter-view
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - name: Check out the original Image Editor for the native ownership control
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: lumine-code/image-editor
          ref: 6a310390f7949855b41e01ef0ac9a5e7dec83893
          path: image-editor-original
      - name: Check out the original notebook runtime for the ownership control
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          path: jupyter-view-original
          ref: 4e15a07b338e0f7894afbaf088d1e17de6e53d5c
      - name: Check out the repaired Image Editor for current native regressions
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: lumine-code/image-editor
          ref: fb5a1b99c3e32be1ebbc4e0ba4a15f28a883ce83
          path: image-editor-current
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Create the private temporary directory
        run: mkdir -p "$TEMP"
      - name: Install Linux build and headless-display dependencies
        if: runner.os == 'Linux'
        run: |
          # A third-party repository on the runner image answering 403 must not
          # fail the job: the lists this actually needs still fetched, and the
          # install below stays strict, so a missing package still stops us.
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      # Mirrors the editor's own CI: install without scripts (patch-package and
      # some native install scripts misbehave; native modules are rebuilt for
      # Electron below), then reproduce the pieces that matter. npm records the
      # @lumine-code git forks with ssh URLs, but the runner has no ssh key, so
      # rewrite them to anonymous HTTPS (the forks are public). Serialized
      # retries absorb flaky git-hosted fork downloads.
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install package dependencies
        working-directory: jupyter-view
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Download the Electron binary
        working-directory: lumine
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Install spec dependency packages
        working-directory: lumine
        run: node script/install-spec-packages.js --package ../jupyter-view --home "$RUNNER_TEMP/lumine-home" --github-env "$GITHUB_ENV"
      - name: Verify identical native notebook regression against the original full runtime
        if: runner.os == 'Linux'
        working-directory: lumine
        timeout-minutes: 20
        run: |
          ln -s "$GITHUB_WORKSPACE/jupyter-view/node_modules" "$GITHUB_WORKSPACE/jupyter-view-original/node_modules"
          cp ../jupyter-view/spec/native-path-ownership-spec.js ../jupyter-view-original/spec/
          set +e
          xvfb-run --auto-servernum npm start -- --test ../jupyter-view-original/spec > "$RUNNER_TEMP/notebook-original.log" 2>&1
          original_status=$?
          set -e
          cat "$RUNNER_TEMP/notebook-original.log"
          test "$original_status" -eq 1
          grep -E '[0-9]+ specs, 1 failure' "$RUNNER_TEMP/notebook-original.log"
          if grep '\[FAIL\]' "$RUNNER_TEMP/notebook-original.log" | grep -Ev '^notebook native path ownership keeps case-distinct native files '; then
            echo "Unexpected original notebook-runtime failure"
            exit 1
          fi
      - name: Run the Jasmine spec suite
        working-directory: lumine
        timeout-minutes: 20
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum npm start -- --test ../jupyter-view/spec
          else
            npm start -- --test ../jupyter-view/spec
          fi
      - name: Verify pinned original POSIX ownership separately from current regressions
        if: runner.os == 'Linux'
        working-directory: lumine
        timeout-minutes: 5
        run: |
          export LUMINE_TEST_IMAGE_EDITOR_PATH="$GITHUB_WORKSPACE/image-editor-original"
          set +e
          xvfb-run --auto-servernum npm start -- --test ../jupyter-view-original/diagnostics/posix-file-ownership-spec.js > "$RUNNER_TEMP/posix-ownership-original.log" 2>&1
          ownership_status=$?
          set -e
          cat "$RUNNER_TEMP/posix-ownership-original.log"
          test "$ownership_status" -eq 1
          grep '3 specs, 2 failures' "$RUNNER_TEMP/posix-ownership-original.log"
          if grep '\[FAIL\]' "$RUNNER_TEMP/posix-ownership-original.log" | grep -Ev '^native POSIX file ownership (opens two case-distinct notebook files|locates both case-distinct image filenames) '; then
            echo "Unexpected native ownership-control failure"
            exit 1
          fi
      - name: Run current native POSIX ownership regressions
        if: runner.os == 'Linux'
        working-directory: lumine
        timeout-minutes: 5
        run: |
          export LUMINE_TEST_IMAGE_EDITOR_PATH="$GITHUB_WORKSPACE/image-editor-current"
          xvfb-run --auto-servernum npm start -- --test ../jupyter-view/diagnostics/posix-file-ownership-spec.js
